<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin / Super Admin - Kuliner Bengkalis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0 rounded-4 p-4">
                    <div class="text-center mb-4">
                        <div class="bg-dark-melayu text-gold rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; font-size: 28px;">
                            <i class="bi bi-shield-lock"></i>
                        </div>
                        <h3 class="fw-bold text-dark-melayu">Login Admin Portal</h3>
                        <p class="text-muted small">Masuk sebagai Admin atau Super Admin</p>
                    </div>
                    <form id="adminLoginForm">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Username / Email</label>
                            <input type="text" class="form-control" id="adminUsername" required placeholder="admin / superadmin">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" id="adminPassword" required placeholder="Password">
                        </div>
                        <button type="submit" class="btn btn-gold w-100 fw-bold py-2 mb-3">Masuk ke Dashboard Admin</button>
                        <div class="text-center">
                            <a href="index.html" class="text-decoration-none small text-muted"><i class="bi bi-arrow-left me-1"></i> Kembali ke Beranda</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
